name: Resource Pack

on:
  push:
    branches: [main]
    paths:
      - 'src/main/resources/resourcepack/**'
      - '.github/workflows/resourcepack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build zip
        env:
          PACK_ROOT: src/main/resources/resourcepack
        run: |
          set -e
          test -f "$PACK_ROOT/pack.mcmeta"
          find "$PACK_ROOT" -type f | sort
          cd "$PACK_ROOT"
          zip -r -X "$GITHUB_WORKSPACE/3dcosmetics.zip" . -x '.*' -x '__MACOSX/*'
          cd "$GITHUB_WORKSPACE"
          ls -l 3dcosmetics.zip
          sha1sum 3dcosmetics.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pack-${{ github.run_number }}
          name: Resource pack ${{ github.run_number }}
          files: 3dcosmetics.zip
          make_latest: true
