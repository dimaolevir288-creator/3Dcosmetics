# ==========================================================
#  3DCosmetics — основная конфигурация
#  Язык сообщений: русский (ru_ru)
# ==========================================================

# Не менять: используется для миграции конфигурации.
config-version: 1

# Язык сообщений плагина. Влияет только на встроенные сообщения
# (messages ниже всё равно имеют приоритет).
language: ru_ru

economy:
  # Если Vault отсутствует, покупки отключены, но меню работает.
  enabled: true
  # Символ валюты в меню (оформление).
  currency-symbol: "$"

rendering:
  # Как часто (в тиках) косметика синхронизируется с владельцем.
  # Меньше — точнее следует за игроком, но больше нагрузка на CPU.
  # 1 = каждый тик, 2-3 — разумный компромисс. Минимум: 1
  refresh-interval-ticks: 2
  # Автоматически скрывать косметику у далёких игроков.
  # Этим занимается стандартный трекинг сущностей; оставьте true.
  hide-out-of-range: true

# ==========================================================
#  Ресурспак: 3D-модели косметики
# ==========================================================
resource-pack:
  # Прямая ссылка на архив. При раздаче через GitHub Actions это
  # постоянная ссылка вида:
  #   https://github.com/USER/REPO/releases/latest/download/3dcosmetics.zip
  # ЗАМЕНИТЕ USER/REPO на свои — сейчас стоит заглушка.
  url: "https://github.com/USER/REPO/releases/latest/download/3dcosmetics.zip"

  # Резервные ссылки: если основная не сработает, клиент попробует эти.
  fallback-urls: []

  # true — клиент обязан принять пакет, иначе не сможет зайти на сервер.
  force: true

  # Текст, который клиент показывает в окне загрузки пакета.
  prompt: "&eДля отображения косметики требуется ресурспак."

  # Встроенный HTTP-сервер плагина.
  # Отключён: порт 8123 на хостинге недоступен снаружи.
  # Включайте только на VDS/локальном сервере, где можно открыть порт
  # и оставить url пустым.
  http-server:
    enabled: false

# ==========================================================
#  Бесплатная примерка косметики
# ==========================================================
trial:
  # true — игроки могут примерить косметику без покупки.
  enabled: true
  # Сколько секунд длится примерка.
  duration-seconds: 5
  # Каждый предмет можно примерить только один раз.
  # Данные хранятся в players/<uuid>.yml в поле trials.
  once-per-cosmetic: true

menu:
  title: "&8Косметика"
  category-title: "&8Косметика &7» &f%category%"
  rows: 6
  # Предмет-заполнитель для пустых слотов.
  filler-material: GRAY_STAINED_GLASS_PANE
  filler-name: " "

sounds:
  enabled: true
  open: BLOCK_CHEST_OPEN
  purchase: ENTITY_PLAYER_LEVELUP
  equip: ITEM_ARMOR_EQUIP_LEATHER
  unequip: ITEM_ARMOR_EQUIP_GENERIC
  error: ENTITY_VILLAGER_NO

# ==========================================================
#  Сообщения
#  Поддерживаются коды цвета &a, &c, ... и HEX-коды &#RRGGBB
# ==========================================================
messages:
  prefix: "&8[&bКосметика&8] &r"

  # Общие
  no-permission: "&cУ вас нет прав на это действие."
  no-economy: "&cЭкономика недоступна. Обратитесь к администрации."
  reloaded: "&aКонфигурация перезагружена."
  unknown-cosmetic: "&cКосметика &f%id%&c не найдена."
  player-not-found: "&cИгрок &f%player%&c не найден."

  # Покупка
  bought: "&aВы купили &f%cosmetic%&a за &e%price%&a."
  not-enough-money: "&cНедостаточно средств. Нужно &e%price%&c, у вас &e%balance%&c."
  not-for-sale: "&cЭту косметику нельзя купить. Её выдаёт администрация."

  # Надевание и снятие
  equipped: "&aВы надели &f%cosmetic%&a."
  unequipped: "&aВы сняли &f%cosmetic%&a."
  already-equipped: "&eЭта косметика уже надета."
  nothing-equipped: "&eУ вас ничего не надето."
  not-owned: "&cУ вас нет этой косметики."
  all-unequipped: "&aСнята вся косметика. Предметов снято: &f%count%&a."

  # Выдача администратором
  granted: "&aВыдана косметика &f%cosmetic%&a игроку &f%player%&a."
  granted-target: "&aВам выдана косметика &f%cosmetic%&a."
  revoked: "&aКосметика &f%cosmetic%&a снята с игрока &f%player%&a."
  revoked-target: "&cУ вас забрали косметику &f%cosmetic%&c."

  # Подсказки по использованию
  usage-give: "&eИспользование: &f/cosmetics give <игрок> <id>"
  usage-take: "&eИспользование: &f/cosmetics take <игрок> <id>"

  # Ресурспак
  resource-pack-required: "&eЗагрузка ресурспака обязательна. Примите его, чтобы играть."
