# ==========================================================
#  3DCosmetics — косметика (русская локализация)
#
#  Каждая запись имеет уникальный id и относится к категории
#  (раздел меню) и к слоту (часть тела).
#
#  СЛОТЫ (поле slot):
#    head — голова   (шляпы, маски, рога)
#    body — тело     (плащи, крылья, накидки, рюкзаки)
#    arms — руки     (наручи, перчатки)
#    legs — ноги     (сапоги, наколенники)
#
#  В одном слоте можно надеть только одну вещь, но разные слоты
#  складываются: шляпа + плащ + наручи + сапоги одновременно.
#
#  Косметика НЕ занимает слоты брони и инвентаря — она рисуется
#  сущностями ItemDisplay, поэтому шляпа надевается поверх шлема.
#
#  Поля:
#    category      — идентификатор категории (раздел меню)
#    slot          — часть тела: head | body | arms | legs
#                    (если не указан — выводится из anchor)
#    display-name  — название в меню (& коды цвета)
#    description   — строки описания
#    icon          — материал иконки в меню
#    price         — цена в валюте Vault (0 = бесплатно, -1 = не продаётся)
#                    если не указана — берётся prices.<слот>.default
#    trial         — можно ли примерить бесплатно (по умолчанию true)
#    permission    — нода LuckPerms для доступа.
#                    Плейсхолдеры: %player% (ник в нижнем регистре), %uuid%
#    model         — описание модели ItemDisplay
#      material         — материал предмета модели
#      item-model       — ключ item-model (1.21.4+), например "3dcosmetics:item/hat_top"
#      custom-model-data — CustomModelData для модели из ресурспака
#      scale            — масштаб модели
#      translation      — смещение от якоря в блоках [вбок, вверх, назад]
#      rotation         — поворот в градусах (yaw, pitch, roll)
#      anchor           — head | back | chest | feet | left_arm | right_arm
#                         left_leg | right_leg
#      billboard        — FIXED | VERTICAL | HORIZONTAL | CENTER
# ==========================================================

config-version: 1

categories:
  hats:
    display-name: "&fШляпы"
    icon: LEATHER_HELMET
    slot: 11
  capes:
    display-name: "&cПлащи"
    icon: ELYTRA
    slot: 13
  wings:
    display-name: "&eКрылья"
    icon: FEATHER
    slot: 15
  armor:
    display-name: "&bДоспехи"
    icon: IRON_CHESTPLATE
    slot: 21
  boots:
    display-name: "&aОбувь"
    icon: LEATHER_BOOTS
    slot: 23

# ==========================================================
#  ЦЕНЫ ПО СЛОТАМ
#
#  default    — цена для косметики без своего поля price.
#  multiplier — множитель для всех предметов этого слота.
#
#  Итог = (price косметики или default слота) * multiplier.
# ==========================================================
prices:
  head:
    default: 2500.0
    multiplier: 1.0
  body:
    default: 4000.0
    multiplier: 1.0
  arms:
    default: 1800.0
    multiplier: 1.0
  legs:
    default: 1500.0
    multiplier: 1.0

